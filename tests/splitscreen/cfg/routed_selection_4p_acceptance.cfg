// Accept from P4's routed pane and instantiate all four local clients.
splitinput_device_key controller3 JOY7 1
wait 3
splitinput_device_key controller3 JOY7 0
wait 30
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 3600
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
cmd forcechanged
splitnet_cmd 2 forcechanged
splitnet_cmd 3 forcechanged
splitnet_cmd 4 forcechanged
wait 180
