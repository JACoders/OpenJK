set com_maxfps 60
set con_notifytime 0
set ui_splitScreenTraceInput 1
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Siege_P1
set ui_splitScreenP1Name QA_Siege_P1
set ui_splitScreenP2Name QA_Siege_P2
set ui_splitScreenP3Name QA_Siege_P3
set ui_splitScreenP4Name QA_Siege_P4
set g_gametype 7
set g_siegeRespawn 1
splitnet_party_connect localhost
devmap mp/siege_hoth
wait 900
closemenu
siegeclass "Imperial Snowtrooper"
splitnet_cmd 2 siegeclass "Rocket Trooper"
splitnet_cmd 3 siegeclass "Rebel Infantry"
splitnet_cmd 4 siegeclass "Jedi Guardian"
wait 700
closemenu
god
splitnet_cmd 2 god
splitnet_cmd 3 god
splitnet_cmd 4 god
wait 60
splitui_assert ui_splitScreenPartyState active
splitui_assert g_gametype 7
splitnet_assert_stat 1 team eq 1
splitnet_assert_stat 2 team eq 1
splitnet_assert_stat 3 team eq 2
splitnet_assert_stat 4 team eq 2
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
screenshot_png phase5_siege_active

echo Phase5Siege: READY_ALL_INPUT
wait 120
splitinput_assert_cmd 1 0 0 0 257
splitinput_assert_cmd 2 -998 0 0 1
splitinput_assert_cmd 3 -998 0 0 1
splitinput_assert_cmd 4 -998 0 0 1
screenshot_png phase5_siege_input
wait 1100
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
quit
