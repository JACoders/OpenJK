set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set password ""
splitnet_party_connect 127.0.0.1:29973
connect 127.0.0.1:29973
// Wait for the serialized P2/P3/P4 handshakes before issuing team commands.
wait 4200
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 420
splitnet_disconnect 3
wait 180
splitui_assert ui_splitScreenPartyState partial
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_rejoin 3 forcechanged free
wait 240
splitnet_cmd 3 team free
wait 600
splitnet_assert_lifecycle 3 ALIVE
splitnet_disconnect 2
splitnet_disconnect 4
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_rejoin 4 forcechanged free
wait 240
splitnet_cmd 4 team free
wait 480
splitnet_assert_lifecycle 4 ALIVE
splitnet_rejoin 2 forcechanged free
wait 240
splitnet_cmd 2 team free
wait 480
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 3 ALIVE
screenshot_png gp5_4p_varied_slot_churn
quit
