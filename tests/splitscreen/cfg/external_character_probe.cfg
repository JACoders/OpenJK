set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Char1
set ui_splitScreenP1Name QA_Char1
set ui_splitScreenP2Name QA_Char2
set ui_splitScreenP3Name QA_Char3
set ui_splitScreenP4Name QA_Char4
set ui_splitScreenP1Model kyle/default
set ui_splitScreenP2Model desann/default
set ui_splitScreenP3Model reborn/default
set ui_splitScreenP4Model kyle/default
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitnet_status
splitscreen_setup 2
wait 40
echo ExternalCharacterProbe: READY_PROFILE
wait 300
splitui_status
screenshot_png splitqa_external_character_profile
echo ExternalCharacterProbe: READY_RIGHT
wait 300
ui_splitScreenP1Model
ui_splitScreenP2Model
ui_splitScreenP2ModelIndex
ui_splitScreenP2ModelIndexModel
ui_splitScreenP3Model
ui_splitScreenP4Model
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP2Model galak/default
splitui_assert ui_splitScreenP3Model reborn/default
splitui_assert ui_splitScreenP4Model kyle/default
screenshot_png splitqa_external_character_right
echo ExternalCharacterProbe: READY_DOWN
wait 300
ui_splitScreenP1Model
ui_splitScreenP2Model
ui_splitScreenP2ModelIndex
ui_splitScreenP2ModelIndexModel
ui_splitScreenP3Model
ui_splitScreenP4Model
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP2Model jedi/default
splitui_assert ui_splitScreenP3Model reborn/default
splitui_assert ui_splitScreenP4Model kyle/default
screenshot_png splitqa_external_character_down
echo ExternalCharacterProbe: READY_LEFT
wait 300
ui_splitScreenP1Model
ui_splitScreenP2Model
ui_splitScreenP2ModelIndex
ui_splitScreenP2ModelIndexModel
ui_splitScreenP3Model
ui_splitScreenP4Model
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP2Model jan/default
splitui_assert ui_splitScreenP3Model reborn/default
splitui_assert ui_splitScreenP4Model kyle/default
screenshot_png splitqa_external_character_left
echo ExternalCharacterProbe: READY_UP
wait 300
ui_splitScreenP1Model
ui_splitScreenP2Model
ui_splitScreenP2ModelIndex
ui_splitScreenP2ModelIndexModel
ui_splitScreenP3Model
ui_splitScreenP4Model
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP2Model desann/default
splitui_assert ui_splitScreenP3Model reborn/default
splitui_assert ui_splitScreenP4Model kyle/default
screenshot_png splitqa_external_character_up
echo ExternalCharacterProbe: READY_CLOSE
wait 300
splitui_status
ui_splitScreenP2Model
splitui_assert ui_splitScreenP2Model desann/default
screenshot_png splitqa_external_character_closed
echo ExternalCharacterProbe: READY_OPEN_TOP
wait 300
splitui_status
splitui_assert ui_splitScreenMenuMode top
ui_splitScreenLastPaint
screenshot_png splitqa_external_character_top
echo ExternalCharacterProbe: READY_REOPEN
wait 400
splitui_status
ui_splitScreenP1Model
ui_splitScreenP2Model
ui_splitScreenP3Model
ui_splitScreenP4Model
splitui_assert ui_splitScreenMenuMode setup
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP2Model desann/default
splitui_assert ui_splitScreenP3Model reborn/default
splitui_assert ui_splitScreenP4Model kyle/default
screenshot_png splitqa_external_character_reopened
echo ExternalCharacterProbe: READY_JOIN
wait 300
splitui_status
splitui_assert ui_splitScreenMenuMode ""
splitnet_assert_lifecycle 2 ALIVE
splitnet_status
screenshot_png splitqa_external_character_gameplay
wait 20
quit
