set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set name QA_Cvar1
set ui_splitScreenP1Name QA_Cvar1
set ui_splitScreenP2Name QA_Cvar2
set ui_splitScreenP3Name QA_Cvar3
set ui_splitScreenP4Name QA_Cvar4
set ui_splitScreenP2Model kyle/default
set ui_splitScreenP3Model reborn/default
set ui_splitScreenP4Model luke/default
set cl_splitScreenP2Sensitivity 123
set cl_splitScreenP3Invert 1
set cl_splitScreenP4AttackButton 5
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
toggleconsole 2
wait 40
toggleconsole 3
wait 40
toggleconsole 4
wait 40
condump splitqa_profile_cvars_console.txt
wait 20
quit
