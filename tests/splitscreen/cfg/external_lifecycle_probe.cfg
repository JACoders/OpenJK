set com_maxfps 60
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenTraceInput 1
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Life1
set ui_splitScreenP1Name QA_Life1
set ui_splitScreenP2Name QA_Life2
set ui_splitScreenP3Name QA_Life3
set ui_splitScreenP4Name QA_Life4
devmap mp/ffa3
wait 360
closemenu
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
cmd kill
splitnet_cmd 2 kill
splitnet_cmd 3 kill
splitnet_cmd 4 kill
wait 120
splitnet_assert_lifecycle 1 DEAD
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_lifecycle 3 DEAD
splitnet_assert_lifecycle 4 DEAD
screenshot_png splitqa_lifecycle_all_dead
echo ExternalLifecycleProbe: READY_RESPAWN_ALL
wait 600
splitinput_assert_cmd 1 0 0 0 257
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
screenshot_png splitqa_lifecycle_all_respawned
splitnet_cmd 2 kill
wait 120
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
echo ExternalLifecycleProbe: READY_RESPAWN_P2
wait 240
splitnet_assert_lifecycle 2 ALIVE
splitscreen_setup 3
wait 30
echo ExternalLifecycleProbe: READY_SPECTATE_P3
wait 240
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 SPECTATOR
splitnet_assert_lifecycle 4 ALIVE
screenshot_png splitqa_lifecycle_p3_spectator
splitscreen_topmenu 3
wait 30
echo ExternalLifecycleProbe: READY_JOIN_P3
wait 1200
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
screenshot_png splitqa_lifecycle_p3_rejoined
wait 20
quit
