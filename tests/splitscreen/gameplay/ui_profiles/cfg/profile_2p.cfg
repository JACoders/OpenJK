// Open Force setup, switch Light -> Dark, choose Destroyer, and apply.
// Destroyer grants Lightning rank 3 and leaves every light-aligned power at 0.
splitinput_device_mouse -10000 -10000
wait 3
splitinput_device_mouse 332 191
wait 3
splitinput_device_key keyboard MOUSE1 1
wait 3
splitinput_device_key keyboard MOUSE1 0
wait 20
splitinput_device_mouse -10000 -10000
wait 3
splitinput_device_mouse 250 65
wait 3
splitinput_device_key keyboard MOUSE1 1
wait 3
splitinput_device_key keyboard MOUSE1 0
wait 10
splitinput_device_mouse -10000 -10000
wait 3
splitinput_device_mouse 250 110
wait 3
splitinput_device_key keyboard MOUSE1 1
wait 3
splitinput_device_key keyboard MOUSE1 0
wait 15
splitui_assert ui_splitScreenP1ForcePowers 7-2-012320333000030321
screenshot_png routed_selection_p1_dark
splitinput_device_mouse -10000 -10000
wait 3
splitinput_device_mouse 320 213
wait 3
splitinput_device_key keyboard MOUSE1 1
wait 3
splitinput_device_key keyboard MOUSE1 0
wait 20

// P2: clamp to the deterministic first portrait, then move to Desann.
splitinput_device_key controller1 JOY10 1
wait 3
splitinput_device_key controller1 JOY10 0
wait 3
splitinput_device_key controller1 JOY7 1
wait 3
splitinput_device_key controller1 JOY7 0
