set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Name VM2_QA_P1
set ui_splitScreenP2Name VM2_QA_P2
set r_splitScreen 0
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
splitnet_connect 2 localhost
wait 300
splitnet_cmd 2 team free
wait 120
splitnet_status
screenshot_png splitqa_multivm_2p_menus
splitinput_device_key keyboard ENTER 1
splitinput_device_key keyboard ENTER 0
splitinput_device_key controller1 ENTER 1
splitinput_device_key controller1 ENTER 0
wait 100
screenshot_png splitqa_multivm_2p_start
splitinput_device_axis controller1 1 -127
wait 100
splitinput_device_axis controller1 1 0
wait 30
screenshot_png splitqa_multivm_2p_after
quit
