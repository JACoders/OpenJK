set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Name VM3_QA_P1
set ui_splitScreenP2Name VM3_QA_P2
set ui_splitScreenP3Name VM3_QA_P3
set r_splitScreen 0
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
wait 320
splitnet_cmd 2 team free
splitnet_cmd 3 team free
wait 140
splitnet_status
screenshot_png splitqa_multivm_3p_menus
splitinput_device_key keyboard ENTER 1
splitinput_device_key keyboard ENTER 0
splitinput_device_key controller1 ENTER 1
splitinput_device_key controller1 ENTER 0
splitinput_device_key controller2 ENTER 1
splitinput_device_key controller2 ENTER 0
wait 100
screenshot_png splitqa_multivm_3p_start
splitinput_device_axis controller1 1 -127
splitinput_device_axis controller2 0 -127
wait 100
splitinput_device_axis controller1 1 0
splitinput_device_axis controller2 0 0
wait 30
screenshot_png splitqa_multivm_3p_after
quit
