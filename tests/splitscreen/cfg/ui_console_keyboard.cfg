set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set name QA_UI1
set ui_splitScreenP1Name QA_UI1
set ui_splitScreenP2Name QA_UI2
set ui_splitScreenP3Name QA_UI3
set ui_splitScreenP4Name QA_UI4
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
wait 40
toggleconsole 2
wait 40
toggleconsole 3
wait 40
toggleconsole 4
wait 40
splitscreen_keyboard 2
wait 40
splitscreen_keyboard 3
wait 40
splitscreen_keyboard 4
wait 80
screenshot_png splitqa_ui_console_keyboard
condump splitqa_ui_console_keyboard_console.txt
wait 20
quit
