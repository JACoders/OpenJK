set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Bind1
set ui_splitScreenP1Name QA_Bind1
set ui_splitScreenP2Name QA_Bind2
set ui_splitScreenP3Name QA_Bind3
set ui_splitScreenP4Name QA_Bind4
set cl_splitScreenP2Bind00 -1
set cl_splitScreenP2Bind01 3
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitscreen_topmenu 2
wait 80
set ui_splitScreenMenuMode controls
set ui_splitScreenInputTarget 2
set ui_splitScreenProfileTarget 2
set ui_splitScreenConfiguring 1
wait 80
splitscreen_bind_controller 2 3 +forward
wait 30
cl_splitScreenP2Bind00
cl_splitScreenP2Bind01
ui_splitScreenControlsCapturedBind
ui_splitScreenControlsAwaitingGamepad
screenshot_png splitqa_controller_bind
condump splitqa_controller_bind_console.txt
wait 20
quit
