set routed_left "splitinput_device_key controller1 JOY13 1; wait 10; splitinput_device_key controller1 JOY13 0; wait 10"
set routed_right "splitinput_device_key controller1 JOY14 1; wait 10; splitinput_device_key controller1 JOY14 0; wait 10"
vstr routed_left
