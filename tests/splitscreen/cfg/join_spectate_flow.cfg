set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_State1
set ui_splitScreenP2Name QA_State2
set ui_splitScreenP3Name QA_State3
set ui_splitScreenP4Name QA_State4
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
// Party handshakes are intentionally serialized. At uncapped render rates,
// 720 frames can expire before P3/P4 receive authoritative snapshots, causing
// their initial team commands to be dropped during ClientBegin.
wait 4200
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
wait 1000
splitnet_cmd 3 team spectator
wait 1000
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 SPECTATOR
splitnet_assert_lifecycle 4 ALIVE
splitnet_cmd 3 team free
wait 1000
splitnet_assert_lifecycle 3 ALIVE
splitnet_cmd 2 team spectator
wait 1000
splitnet_assert_lifecycle 2 SPECTATOR
splitnet_cmd 2 team free
wait 1000
splitnet_assert_lifecycle 2 ALIVE
splitnet_cmd 4 team spectator
wait 1000
splitnet_assert_lifecycle 4 SPECTATOR
splitnet_cmd 4 team free
wait 1000
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_join_spectate_flow
condump splitqa_join_spectate_flow_console.txt
wait 20
quit
