set developer 0
set com_maxfps 60
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Team_P1
set ui_splitScreenP1Name QA_Team_P1
set ui_splitScreenP2Name QA_Team_P2
set ui_splitScreenP3Name QA_Team_P3
set ui_splitScreenP4Name QA_Team_P4
set g_gametype 6
splitnet_party_connect localhost
devmap mp/ffa3
wait 800
closemenu
splitscreen_setup 2
wait 60
echo ExternalTeamProfileProbe: READY_BLUE
wait 600
splitui_status
splitui_assert ui_splitScreenMenuMode ""
splitnet_assert_stat 2 team eq 2
splitnet_assert_lifecycle 2 ALIVE
screenshot_png splitqa_external_team_blue
quit
