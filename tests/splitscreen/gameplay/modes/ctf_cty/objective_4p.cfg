set objective_join "splitnet_connect 2 localhost; splitnet_connect 3 localhost; splitnet_connect 4 localhost"
set objective_teams "splitnet_cmd 2 team blue; splitnet_cmd 3 team red; splitnet_cmd 4 team blue"
set objective_assert_teams "splitnet_assert_stat 1 team eq 1; splitnet_assert_stat 2 team eq 2; splitnet_assert_stat 3 team eq 1; splitnet_assert_stat 4 team eq 2"
set objective_assert_alive "splitnet_assert_lifecycle 1 ALIVE; splitnet_assert_lifecycle 2 ALIVE; splitnet_assert_lifecycle 3 ALIVE; splitnet_assert_lifecycle 4 ALIVE"
set objective_assert_intermission "splitnet_assert_lifecycle 2 INTERMISSION; splitnet_assert_lifecycle 3 INTERMISSION; splitnet_assert_lifecycle 4 INTERMISSION"
set objective_assert_clients "splitnet_assert_stat 2 clientnum eq 1; splitnet_assert_stat 3 clientnum eq 2; splitnet_assert_stat 4 clientnum eq 3"
exec splitqa/objective_lifecycle.cfg
