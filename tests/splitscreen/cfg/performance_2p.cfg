set com_maxfps 0
set com_busyWait 0
set r_swapInterval 0
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set name Perf_P1
set ui_splitScreenP2Name Perf_P2
splitnet_party_connect localhost
devmap mp/ffa3
wait 480
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_applyprofile 2
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
echo SplitPerf: BEGIN players=2
set com_speeds 1
wait 1200
set com_speeds 0
echo SplitPerf: END players=2
screenshot_png splitqa_performance_2p
wait 20
quit
