set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Top1
set ui_splitScreenP1Name QA_Top1
set ui_splitScreenP2Name QA_Top2
set ui_splitScreenP3Name QA_Top3
set ui_splitScreenP4Name QA_Top4
set con_notifytime 0
devmap mp/ffa3
wait 360
closemenu
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitscreen_topmenu 2
wait 120
splitui_status
ui_splitScreenLastPaint
screenshot_png splitqa_multivm_top_menu
splitinput_device_key controller1 RIGHTARROW 1
splitinput_device_key controller1 RIGHTARROW 0
wait 40
ui_splitScreenP1TopFocusedItem
ui_splitScreenP2TopFocusedItem
ui_splitScreenP3TopFocusedItem
ui_splitScreenP4TopFocusedItem
splitui_assert ui_splitScreenP2TopFocusedItem join
screenshot_png splitqa_multivm_top_menu_p2_right
wait 20
quit
