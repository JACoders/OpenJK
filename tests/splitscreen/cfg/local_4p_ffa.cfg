set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set name QA_P1
set ui_splitScreenP1Name QA_P1
set ui_splitScreenP2Name QA_P2
set ui_splitScreenP3Name QA_P3
set ui_splitScreenP4Name QA_P4
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_local_4p_ffa_start
wait 20
splitinput_device_axis controller1 1 -127
splitinput_device_axis controller2 0 -80
splitinput_device_button controller3 0 1
wait 20
splitinput_assert_cmd 2 127 0 0 0
splitinput_assert_cmd 3 0 -80 0 0
splitinput_assert_cmd 4 0 0 0 1
splitinput_device_axis controller1 1 0
splitinput_device_axis controller2 0 0
splitinput_device_button controller3 0 0
wait 20
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_local_4p_ffa_after
condump splitqa_local_4p_ffa_console.txt
wait 20
quit
