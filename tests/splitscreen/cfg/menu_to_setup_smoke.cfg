set cl_splitScreenLocalCmds 0
wait 300

// Main menu -> Play.
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 100 226
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 240

// Start Playing -> Split Screen.
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 320 142
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 240

// Select two players, exercise both layout buttons, leave vertical selected,
// then continue to the two independent setup panes.
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 210 102
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 120

splitinput_device_mouse -10000 -10000
splitinput_device_mouse 524 162
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 60
splitui_assert cl_splitScreenLayout 1

splitinput_device_mouse -10000 -10000
splitinput_device_mouse 398 162
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 60
splitui_assert cl_splitScreenLayout 0

splitinput_device_mouse -10000 -10000
splitinput_device_mouse 524 162
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 60
splitui_assert cl_splitScreenLayout 1
screenshot_png split_menu_layout_vertical_selected

splitinput_device_mouse -10000 -10000
splitinput_device_mouse 470 436
splitinput_device_key keyboard MOUSE1 1
splitui_assert ui_splitScreenPendingSetup 1
splitui_assert ui_splitScreenMenuMode setup
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 360

splitui_assert ui_splitScreenPlayerCount 2
splitui_assert ui_splitScreenP1Input keyboard
splitui_assert ui_splitScreenP2Input controller1
splitui_assert cl_splitScreen 1
splitui_assert cl_splitScreenLayout 1
splitui_assert ui_splitScreenPendingSetup 0
splitui_assert ui_splitScreenMenuMode setup
splitui_assert ui_splitScreenLastPaint setup
splitinput_device_mouse 1000000 0
wait 20
splitui_assert ui_splitScreenMouseOwner 1
splitui_assert ui_splitScreenMouseCursorX 319
splitui_status
screenshot_png split_menu_to_setup_smoke
wait 20
quit
