set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set password ""
set name GP5_Control_P1
set ui_splitScreenP2Name GP5_Control_P2
set ui_splitScreenP3Name GP5_Control_P3
set ui_splitScreenP4Name GP5_Control_P4
splitnet_party_connect 127.0.0.1:29953
connect 127.0.0.1:29953
// P2-P4 connect serially; do not send their first team commands until the
// fourth client has completed ClientBegin and owns an authoritative snapshot.
wait 4200
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 420
splitui_assert ui_splitScreenPartyState active
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_assert_stat 1 clientnum eq 0
splitnet_assert_stat 2 clientnum eq 1
splitnet_assert_stat 3 clientnum eq 2
splitnet_assert_stat 4 clientnum eq 3
screenshot_png gp5_4p_controlled
splitnet_disconnect 4
wait 120
splitui_assert ui_splitScreenPartyState partial
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_rejoin 4 forcechanged free
wait 240
splitnet_cmd 4 team free
wait 900
splitui_assert ui_splitScreenPartyState active
splitnet_assert_lifecycle 4 ALIVE
splitnet_assert_stat 4 clientnum eq 3
screenshot_png gp5_4p_controlled_rejoin
quit
