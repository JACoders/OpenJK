set com_maxfps 60
set con_notifytime 0
set developer 1
set logfile 2
set cl_splitScreen 1
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name Objective_P1
set ui_splitScreenP1Name Objective_P1
set ui_splitScreenP2Name Objective_P2
set ui_splitScreenP3Name Objective_P3
set ui_splitScreenP4Name Objective_P4
set capturelimit 1

devmap mp/ctf1
wait 420
closemenu
cmd team red
vstr objective_join
wait 420
vstr objective_teams
wait 240
closemenu
vstr objective_assert_teams
vstr objective_assert_alive
splitnet_assert_stat 1 clientnum eq 0
vstr objective_assert_clients
echo ObjectiveLifecycle: READY
screenshot_png objective_start

// Red P1 takes Blue's flag, proving a real pickup before the drop path.
cmd setviewpos 512 0 988 270
wait 120
splitnet_assert_stat 1 score ge 10
screenshot_png objective_enemy_flag_pickup

// Death must drop the carried objective; Blue P2 then touches its dropped flag.
cmd kill
wait 45
splitnet_assert_lifecycle 1 DEAD
splitnet_cmd 2 setviewpos 512 0 988 270
wait 180
screenshot_png objective_drop_return

// Respawn, take the flag again, and carry it to Red's base for the limit.
+attack
wait 10
-attack
wait 180
splitnet_assert_lifecycle 1 ALIVE
cmd setviewpos 512 0 988 270
wait 120
splitnet_assert_stat 1 score ge 19
cmd setviewpos -6464 0 988 270
wait 180
splitnet_assert_stat 1 score ge 1
screenshot_png objective_capture

wait 420
splitnet_assert_lifecycle 1 INTERMISSION
vstr objective_assert_intermission
screenshot_png objective_intermission

map_restart 0
wait 600
vstr objective_assert_alive
splitnet_assert_stat 1 clientnum eq 0
vstr objective_assert_clients
screenshot_png objective_restart
splitnet_status
condump objective_console.txt
quit
