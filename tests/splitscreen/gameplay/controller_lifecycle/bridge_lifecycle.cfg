set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name GP1_Controller_P1
set ui_splitScreenP2Name GP1_Controller_P2
set ui_splitScreenP3Name GP1_Controller_P3
set ui_splitScreenP4Name GP1_Controller_P4
set con_notifytime 0
devmap mp/ffa3
wait 360
closemenu
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 120

// Exercise persistent gameplay remaps through the external SDL bridge.
splitscreen_bind_controller 2 4 +attack
splitscreen_bind_controller 3 5 +force_lightning
splitscreen_bind_controller 4 6 +moveup
splitscreen_bind_controller 2 7 +use
splitscreen_bind_controller 3 8 weapon 5
wait 30

echo GP1-CONTROLLER:READY-CONCURRENT
wait 240
splitinput_assert_cmd 2 -998 0 0 1
splitinput_assert_cmd 3 0 -998 0 1024
splitinput_assert_cmd 4 0 0 127 0
echo GP1-CONTROLLER:CONCURRENT-CHECKED
wait 120
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
echo GP1-CONTROLLER:RELEASE-CHECKED

echo GP1-CONTROLLER:READY-EXTRA-REMAP
wait 120
splitinput_assert_cmd 2 0 0 0 32
splitinput_assert_cmd 3 0 0 0 0 5
echo GP1-CONTROLLER:EXTRA-REMAP-CHECKED
wait 90
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0

// A menu transition while P2 attack is held must neutralize gameplay input.
echo GP1-CONTROLLER:READY-PAUSE
wait 120
splitscreen_topmenu 2
wait 60
splitinput_assert_cmd 2 0 0 0 0
echo GP1-CONTROLLER:PAUSE-CHECKED
set ui_splitScreenMenuMode ""
set ui_splitScreenInputTarget 0
closemenu
wait 30

// Restart the input subsystem and prove the stable slots recover.
in_restart
wait 180
echo GP1-CONTROLLER:READY-RESTART
wait 180
splitinput_assert_cmd 2 -998 0 0 1
splitinput_assert_cmd 3 0 -998 0 1024
splitinput_assert_cmd 4 0 0 127 0
echo GP1-CONTROLLER:RESTART-CHECKED
wait 120
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
screenshot_png gp1_controller_lifecycle
condump gp1_controller_lifecycle_console.txt
echo GP1-CONTROLLER:COMPLETE
wait 20
quit
