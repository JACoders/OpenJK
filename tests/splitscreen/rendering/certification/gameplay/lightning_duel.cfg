set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLayout 0
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set g_gametype 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set name Kyle
set model kyle/default
set forcepowers 7-2-030000030000000000
set ui_splitScreenP1Name Kyle
set ui_splitScreenP1Model kyle/default
set ui_splitScreenP1ForcePowers 7-2-030000030000000000
set ui_splitScreenP2Name Light_Sith
set ui_splitScreenP2Model reborn/default
set ui_splitScreenP2ForcePowers 7-1-332300000330003230
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_applyprofile 2
cmd forcechanged
splitnet_cmd 2 forcechanged
wait 180
cmd team free
splitnet_cmd 2 team free
// Team transitions can rewrite userinfo; reapply the frozen P2 profile last so
// the server configstring and every local cgame receive the Sith model/powers.
splitnet_applyprofile 2
splitnet_cmd 2 forcechanged
unbind l
bind l "+force_lightning"
wait 120
cmd splitscreen_assert_userinfo 2 model reborn/default
cmd splitscreen_assert_userinfo 2 forcepowers 7-1-332300000330003230
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE

// P2 attacks Kyle through controller1's normal attack binding.
splitnet_stage_pair 2 1 40
cmd giveother 0 health 100
wait 60
splitinput_device_button controller1 0 1
wait 300
splitinput_assert_cmd 2 -999 -999 -999 1
splitinput_device_button controller1 0 0
wait 60
splitnet_assert_stat 1 health lt 100
screenshot_png acceptance_p2_attacks_kyle

// Kyle's final damage is real Force Lightning from a queued keyboard event.
splitnet_stage_pair 1 2 72
cmd giveother 1 health 1
wait 60
splitinput_device_key keyboard l 1
wait 20
splitinput_assert_cmd 1 -999 -999 -999 1280
screenshot_png acceptance_kyle_lightning
// P2's light-side Absorb spends its Force pool first; keep the same keyboard
// Lightning event held until the protection is exhausted and damage lands.
wait 600
splitinput_device_key keyboard l 0
wait 120
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_stat 1 score ge 1
screenshot_png acceptance_kyle_lightning_kill
condump acceptance_lightning_duel_console.txt
wait 20
quit
