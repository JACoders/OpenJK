set objective_join "splitnet_connect 2 localhost"
set objective_teams "splitnet_cmd 2 team blue"
set objective_assert_teams "splitnet_assert_stat 1 team eq 1; splitnet_assert_stat 2 team eq 2"
set objective_assert_alive "splitnet_assert_lifecycle 1 ALIVE; splitnet_assert_lifecycle 2 ALIVE"
set objective_assert_intermission "splitnet_assert_lifecycle 2 INTERMISSION"
set objective_assert_clients "splitnet_assert_stat 2 clientnum eq 1"
exec splitqa/objective_lifecycle.cfg
