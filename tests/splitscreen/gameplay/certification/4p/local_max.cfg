set com_maxfps 60
set con_notifytime 0
set ui_splitScreenTraceInput 1
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_4P_1
set ui_splitScreenP1Name QA_4P_1
set ui_splitScreenP2Name QA_4P_2
set ui_splitScreenP3Name QA_4P_3
set ui_splitScreenP4Name QA_4P_4
set model kyle/default
set saber1 Kyle
set ui_splitScreenP2Model jan/default
set ui_splitScreenP2Saber1 reborn
set ui_splitScreenP3Model reborn/default
set ui_splitScreenP3Saber1 Luke
set ui_splitScreenP4Model luke/default
set ui_splitScreenP4Saber1 desann
set ui_splitScreenP2ForcePowers 7-1-032330000000001333
set ui_splitScreenP3ForcePowers 7-1-032330000000001333
set ui_splitScreenP4ForcePowers 7-1-032330000000001333
set g_saberDamageScale 5
devmap mp/ffa3
wait 360
closemenu
cmd team free
wait 80
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
splitnet_cmd 2 forcechanged
splitnet_cmd 3 forcechanged
splitnet_cmd 4 forcechanged
wait 180
closemenu
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
cmd splitscreen_assert_userinfo 1 name QA_4P_1
cmd splitscreen_assert_userinfo 1 model kyle/default
cmd splitscreen_assert_userinfo 1 saber1 Kyle
cmd splitscreen_assert_userinfo 2 name QA_4P_2
cmd splitscreen_assert_userinfo 2 model jan/default
cmd splitscreen_assert_userinfo 2 saber1 reborn
cmd splitscreen_assert_userinfo 3 name QA_4P_3
cmd splitscreen_assert_userinfo 3 model reborn/default
cmd splitscreen_assert_userinfo 3 saber1 Luke
cmd splitscreen_assert_userinfo 4 name QA_4P_4
cmd splitscreen_assert_userinfo 4 model luke/default
cmd splitscreen_assert_userinfo 4 saber1 desann
screenshot_png gp5_4p_profiles

unbind l
bind l +force_lightning
splitnet_stage_pair 1 2 72
cmd giveother 1 health 1
cmd give force
wait 60
splitinput_device_key keyboard l 1
wait 30
splitinput_assert_cmd 1 -999 -999 -999 1280
wait 300
splitinput_device_key keyboard l 0
wait 120
splitnet_assert_lifecycle 2 ALIVE

echo GP5-03:BRIDGE-P2
wait 120
splitinput_assert_cmd 2 -998 0 0 0
wait 240
echo GP5-03:BRIDGE-P3
wait 120
splitinput_assert_cmd 3 0 -998 0 0
wait 240
echo GP5-03:BRIDGE-P4
wait 120
splitinput_assert_cmd 4 0 0 0 1
wait 240
echo GP5-03:BRIDGE-ALL
wait 120
splitinput_assert_cmd 2 -998 0 0 0
splitinput_assert_cmd 3 0 -998 0 0
splitinput_assert_cmd 4 0 0 0 1
screenshot_png phase5_4p_simultaneous_attack
wait 420
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0

splitscreen_bind_controller 2 10 force_throw
splitscreen_bind_controller 3 10 force_throw
splitscreen_bind_controller 4 10 force_throw
echo GP5-03:FORCE-P2
wait 120
splitui_assert cl_splitScreenP2LastGenericCmd 5
wait 480
echo GP5-03:FORCE-P3
wait 120
splitui_assert cl_splitScreenP3LastGenericCmd 5
wait 480
echo GP5-03:FORCE-P4
wait 120
splitui_assert cl_splitScreenP4LastGenericCmd 5
wait 480
set cl_splitScreenP2LastGenericCmd 0
set cl_splitScreenP3LastGenericCmd 0
set cl_splitScreenP4LastGenericCmd 0
echo GP5-03:FORCE-ALL
// The external bridge publishes three controller packets back-to-back. Give
// the fourth player's event one full command-sampling window before asserting.
wait 300
splitui_assert cl_splitScreenP2LastGenericCmd 5
splitui_assert cl_splitScreenP3LastGenericCmd 5
splitui_assert cl_splitScreenP4LastGenericCmd 5
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
screenshot_png phase5_4p_force
splitscreen_reset_controller 2
splitscreen_reset_controller 3
splitscreen_reset_controller 4
wait 20
quit
