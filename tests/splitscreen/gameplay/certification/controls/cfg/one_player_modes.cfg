set con_notifytime 0
set cl_splitScreen 0
set name GP5_Control
wait 300
screenshot_png gp5_control_main_menu

// Exercise the ordinary Main Menu -> Play path with the real keyboard/mouse
// route before using deterministic console sequencing for the stock-mode sweep.
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 100 226
splitinput_device_key keyboard MOUSE1 1
wait 3
splitinput_device_key keyboard MOUSE1 0
wait 300
screenshot_png gp5_control_multiplayer
closemenu
wait 30
splitui_assert cl_splitScreen 0

set g_gametype 0
devmap mp/ffa3
wait 720
team free
wait 120
echo GP5ControlMode FFA
splitui_assert cl_splitScreen 0
screenshot_png gp5_control_ffa

set g_gametype 1
devmap mp/ffa3
wait 720
team free
wait 120
echo GP5ControlMode HOLOCRON
splitui_assert cl_splitScreen 0
screenshot_png gp5_control_holocron

