set developer 1
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set g_gametype 3
set duel_fraglimit 1
set g_saberDamageScale 20
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/duel1
wait 2400
closemenu
splitui_assert ui_splitScreenPartyState active
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 600
splitui_assert g_gametype 3
splitnet_status
echo GP2-DUEL:INITIAL
wait 30
echo GP2-DUEL:DUEL-CAPACITY
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 SPECTATOR
splitnet_assert_lifecycle 4 SPECTATOR
screenshot_png gp2_duel_4p_initial
echo GP2-DUEL:ROUND-P1-WIN
splitnet_stage_pair 1 2 44
cmd giveother 1 health 1
wait 60
splitinput_device_key keyboard MOUSE1 1
wait 180
splitinput_device_key keyboard MOUSE1 0
wait 300
splitnet_assert_stat 1 score ge 1
splitnet_status
screenshot_png gp2_duel_4p_round1
echo GP2-DUEL:TURNOVER
wait 420
splitnet_status
echo GP2-DUEL:VOLUNTARY-SPECTATE-REJOIN
splitnet_cmd 3 team spectator
wait 90
splitnet_assert_lifecycle 3 SPECTATOR
splitnet_cmd 3 team free
wait 180
splitnet_status
echo GP2-DUEL:DISCONNECT-REJOIN
splitnet_disconnect 3
wait 90
splitnet_connect 3 localhost
wait 300
splitnet_cmd 3 team free
wait 120
splitnet_status
screenshot_png gp2_duel_4p_final
splitnet_status
echo GP2-DUEL:COMPLETE
condump gp2_duel_4p_console.txt
wait 20
quit
