set com_maxfps 60
set con_notifytime 0
set ui_splitScreenTraceInput 1
set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set name QA_3P_1
set ui_splitScreenP1Name QA_3P_1
set ui_splitScreenP2Name QA_3P_2
set ui_splitScreenP3Name QA_3P_3
set ui_splitScreenP2ForcePowers 7-1-032330000000001333
set ui_splitScreenP3ForcePowers 7-1-032330000000001333
set g_saberDamageScale 5
devmap mp/ffa3
wait 360
closemenu
cmd team free
wait 80
splitnet_connect 2 localhost
splitnet_connect 3 localhost
wait 360
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_cmd 2 forcechanged
splitnet_cmd 3 forcechanged
wait 180
closemenu
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE

splitnet_stage_pair 1 2 44
wait 90
echo Phase5ThreeCombat: READY_P1_KILL_P2
wait 100
splitinput_assert_cmd 1 0 0 0 257
wait 700
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_stat 1 hits gt 0
splitnet_assert_stat 1 score ge 1
echo Phase5ThreeCombat: READY_RESPAWN_P2
wait 450
splitnet_assert_lifecycle 2 ALIVE

splitnet_stage_pair 2 3 44
wait 90
echo Phase5ThreeCombat: READY_P2_KILL_P3
wait 100
splitinput_assert_cmd 2 0 0 0 1
wait 700
splitnet_assert_lifecycle 3 DEAD
splitnet_assert_stat 2 hits gt 0
splitnet_assert_stat 2 score ge 1
echo Phase5ThreeCombat: READY_RESPAWN_P3
wait 450
splitnet_assert_lifecycle 3 ALIVE

splitnet_stage_pair 3 1 44
wait 90
echo Phase5ThreeCombat: READY_P3_KILL_P1
wait 100
splitinput_assert_cmd 3 0 0 0 1
wait 700
splitnet_assert_lifecycle 1 DEAD
splitnet_assert_stat 3 hits gt 0
splitnet_assert_stat 3 score ge 1
screenshot_png phase5_3p_kill_cycle
echo Phase5ThreeCombat: READY_RESPAWN_P1
wait 450
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE

echo Phase5ThreeCombat: READY_ALL_ATTACK
wait 120
splitinput_assert_cmd 1 0 0 0 257
splitinput_assert_cmd 2 -998 0 0 1
splitinput_assert_cmd 3 -998 0 0 1
screenshot_png phase5_3p_simultaneous_attack
wait 700
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0

splitscreen_bind_controller 2 10 force_throw
splitscreen_bind_controller 3 10 force_throw
set cl_splitScreenP2LastGenericCmd 0
set cl_splitScreenP3LastGenericCmd 0
echo Phase5ThreeCombat: READY_ALL_FORCE
wait 200
splitui_assert cl_splitScreenP2LastGenericCmd 5
splitui_assert cl_splitScreenP3LastGenericCmd 5
wait 180
splitnet_assert_stat 2 force lt 100
splitnet_assert_stat 3 force lt 100
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
screenshot_png phase5_3p_force
splitscreen_reset_controller 2
splitscreen_reset_controller 3
wait 20
quit
