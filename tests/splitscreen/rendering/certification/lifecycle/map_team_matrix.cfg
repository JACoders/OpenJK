set com_maxfps 60
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set g_gametype 6
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name Cert_Life1
set ui_splitScreenP2Name Cert_Life2
set ui_splitScreenP3Name Cert_Life3
set ui_splitScreenP4Name Cert_Life4
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
cmd team red
splitnet_cmd 2 team blue
splitnet_cmd 3 team red
splitnet_cmd 4 team blue
wait 240
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_assert_stat 1 team eq 1
splitnet_assert_stat 2 team eq 2
splitnet_assert_stat 3 team eq 1
splitnet_assert_stat 4 team eq 2
screenshot_png cert_lifecycle_team_before_restart
map_restart 0
wait 480
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_assert_stat 1 team eq 1
splitnet_assert_stat 2 team eq 2
splitnet_assert_stat 3 team eq 1
splitnet_assert_stat 4 team eq 2
screenshot_png cert_lifecycle_team_after_restart
splitnet_status
condump cert_lifecycle_map_team_console.txt
wait 20
quit
