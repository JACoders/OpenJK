set cl_splitScreenLocalCmds 0
set con_notifytime 0
wait 300

// Reach two-player setup exclusively through the visible main-menu path.
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 100 226
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 240
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 320 142
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 240
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 210 102
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 120
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 470 436
splitinput_device_key keyboard MOUSE1 1
wait 20
splitinput_device_key keyboard MOUSE1 0
wait 360
splitui_assert ui_splitScreenMenuMode setup

// Accept the visible setup with P1's keyboard. This must hand off to the
// full-screen create-server UI without retaining pane cursor clipping.
splitinput_device_key keyboard ENTER 1
wait 4
splitinput_device_key keyboard ENTER 0
wait 120
splitui_assert ui_splitScreenSetupComplete 1
splitui_assert cl_splitScreenRenderReady 0
splitui_assert ui_splitScreenHostPending 1
splitui_assert ui_splitScreenPartyState host_pending
splitinput_device_mouse -10000 -10000
splitinput_device_mouse 340 360
wait 30
screenshot_png reported_create_server_lower_cursor

// Model the Create Server BEGIN action. P1 remains the only rendered view
// until P2 has a live cgame; party completion must consume the pre-game setup
// marker instead of opening character setup for a second time.
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 30
splitui_assert cl_splitScreenRenderReady 0
screenshot_png reported_primary_visible_while_p2_connects
wait 1770
splitui_assert ui_splitScreenPartyState active
splitui_assert cl_splitScreenRenderReady 1
splitui_assert ui_splitScreenSetupComplete 0
splitui_assert ui_splitScreenConfiguring 0
splitui_assert ui_splitScreenPendingSetup 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png reported_two_player_ready_without_repeat_setup
condump reported_startup_regressions_2p_console.txt
wait 20
quit
