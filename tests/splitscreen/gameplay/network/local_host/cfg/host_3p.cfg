set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 0
set sv_maxclients 8
set g_maxConnPerIP 8
set g_gametype 0
set fraglimit 10
set sv_hostname GP301_LAN_3P
devmap mp/ffa3
wait 720
closemenu
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
wait 480
splitnet_cmd 2 team free
splitnet_cmd 3 team free
wait 240
echo GP301:ATTACHED
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_status
screenshot_png gp301_3p_attached
splitinput_device_button controller2 0 1
wait 30
splitinput_assert_cmd 3 -999 -999 -999 1
splitinput_device_button controller2 0 0
echo GP301:RESTART
map_restart 0
wait 600
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_status
screenshot_png gp301_3p_restarted
wait 1200
echo GP301:SHUTDOWN
quit
