set com_maxfps 60
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenTraceInput 1
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Controls1
set ui_splitScreenP1Name QA_Controls1
set ui_splitScreenP2Name QA_Controls2
set ui_splitScreenP3Name QA_Controls3
set ui_splitScreenP4Name QA_Controls4
devmap mp/ffa3
wait 360
closemenu
cmd team free
splitnet_connect 2 localhost
splitnet_connect 3 localhost
splitnet_connect 4 localhost
wait 360
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 120
splitscreen_reset_controller 2
splitscreen_topmenu 2
wait 60
echo ExternalControlsProbe: READY_OPEN
wait 300
splitui_assert ui_splitScreenMenuMode controls
screenshot_png splitqa_controls_movement
echo ExternalControlsProbe: READY_INTERACTION
wait 300
screenshot_png splitqa_controls_interaction
echo ExternalControlsProbe: READY_WEAPONS
wait 300
screenshot_png splitqa_controls_weapons
echo ExternalControlsProbe: READY_FORCE1
wait 300
screenshot_png splitqa_controls_force1
echo ExternalControlsProbe: READY_FORCE2
wait 300
screenshot_png splitqa_controls_force2
echo ExternalControlsProbe: READY_MOUSE
wait 300
screenshot_png splitqa_controls_mouse
echo ExternalControlsProbe: READY_OTHER
wait 300
screenshot_png splitqa_controls_other
echo ExternalControlsProbe: READY_BIND
wait 300
cl_splitScreenP2Bind10
splitui_assert cl_splitScreenP2Bind10 9
ui_splitScreenControlsCapturedBind
screenshot_png splitqa_controls_binding
splitscreen_bind_controller 2 0 +attack
splitscreen_reset_controller 2
splitui_assert cl_splitScreenP2Bind10 0
splitui_assert cl_splitScreenP2Bind14 9
echo ExternalControlsProbe: READY_BACK
wait 180
splitui_assert ui_splitScreenMenuMode top
screenshot_png splitqa_controls_back
wait 20
quit
