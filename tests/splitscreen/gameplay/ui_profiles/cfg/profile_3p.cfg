// Accept through P3's routed Start action and instantiate all three live clients.
splitinput_device_key controller2 JOY7 1
wait 3
splitinput_device_key controller2 JOY7 0
wait 30
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 3600
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
wait 180
cmd forcechanged
splitnet_cmd 2 forcechanged
splitnet_cmd 3 forcechanged
wait 180
cmd splitscreen_assert_userinfo 1 model kyle/default
cmd splitscreen_assert_userinfo 1 forcepowers 7-2-012320333000030321
cmd splitscreen_assert_userinfo 2 model desann/default
cmd splitscreen_assert_userinfo 2 forcepowers 7-1-332300000330003230
cmd splitscreen_assert_userinfo 3 model reborn/default
cmd splitscreen_assert_userinfo 3 forcepowers 7-1-332300000330003230
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
screenshot_png routed3_gameplay_all_alive

// Controller1 can attack only as P2.
unbind l
bind l "+force_lightning"
splitnet_stage_pair 2 1 40
cmd giveother 0 health 100
wait 60
splitinput_device_button controller1 0 1
wait 60
splitinput_assert_cmd 1 -999 -999 -999 0
splitinput_assert_cmd 2 -999 -999 -999 1
splitinput_assert_cmd 3 -999 -999 -999 0
splitinput_device_button controller1 0 0
wait 60
splitnet_assert_stat 1 health lt 100
screenshot_png routed3_gameplay_p2_attacks_p1

// Controller2 can attack only as P3.
splitnet_stage_pair 3 1 40
cmd giveother 0 health 100
wait 60
splitinput_device_button controller2 0 1
wait 60
splitinput_assert_cmd 1 -999 -999 -999 0
splitinput_assert_cmd 2 -999 -999 -999 0
splitinput_assert_cmd 3 -999 -999 -999 1
splitinput_device_button controller2 0 0
wait 60
splitnet_assert_stat 1 health lt 100
screenshot_png routed3_gameplay_p3_attacks_p1

// P1's routed keyboard Lightning kills P2 for frag one.
splitnet_stage_pair 1 2 72
cmd giveother 1 health 1
cmd give force
wait 60
splitinput_device_key keyboard l 1
wait 20
splitinput_assert_cmd 1 -999 -999 -999 1280
splitinput_assert_cmd 2 -999 -999 -999 0
splitinput_assert_cmd 3 -999 -999 -999 0
screenshot_png routed3_gameplay_kyle_lightning_p2
wait 600
splitinput_device_key keyboard l 0
wait 120
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_stat 1 score ge 1
screenshot_png routed3_gameplay_p2_down

// Replenish Kyle's selected Lightning, kill P3, and hit the two-frag limit.
splitnet_stage_pair 1 3 72
cmd giveother 2 health 1
cmd give force
wait 60
splitinput_device_key keyboard l 1
wait 20
splitinput_assert_cmd 1 -999 -999 -999 1280
splitinput_assert_cmd 2 -999 -999 -999 0
splitinput_assert_cmd 3 -999 -999 -999 0
screenshot_png routed3_gameplay_kyle_lightning_p3
wait 600
splitinput_device_key keyboard l 0
wait 60
splitnet_assert_stat 1 score ge 2
screenshot_png routed3_gameplay_p3_down
wait 300
splitnet_assert_lifecycle 1 INTERMISSION
splitnet_assert_lifecycle 2 INTERMISSION
splitnet_assert_lifecycle 3 INTERMISSION
screenshot_png routed3_match_complete
condump routed3_continuous_console.txt
wait 20
quit
