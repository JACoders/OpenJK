set cl_splitScreen 1
set cl_splitScreenLayout 0
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Isolation1
set ui_splitScreenP1Name QA_Isolation1
set ui_splitScreenP2Name QA_Isolation2
set ui_splitScreenP3Name QA_Isolation3
set ui_splitScreenP4Name QA_Isolation4
set ui_splitScreenP1Model kyle/default
set ui_splitScreenP2Model reborn/default
set ui_splitScreenP3Model desann/default
set ui_splitScreenP4Model tavion/default
set ui_splitScreenTraceInput 1
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitinput_route_status

echo InputIsolation4Assert ui_controller1_p2_only
splitscreen_setup 4
wait 60
splitinput_device_key controller1 RIGHTARROW 1
wait 4
splitinput_device_key controller1 RIGHTARROW 0
wait 30
splitinput_assert_model 1 kyle/default
splitinput_assert_model 2 reborn_new/default
splitinput_assert_model 3 desann/default
splitinput_assert_model 4 tavion/default
splitui_assert ui_splitScreenInputTarget 2

echo InputIsolation4Assert ui_controller2_p3_only
splitinput_device_key controller2 RIGHTARROW 1
wait 4
splitinput_device_key controller2 RIGHTARROW 0
wait 30
splitinput_assert_model 1 kyle/default
splitinput_assert_model 2 reborn_new/default
splitinput_assert_model 3 galak/default
splitinput_assert_model 4 tavion/default
splitui_assert ui_splitScreenInputTarget 3

echo InputIsolation4Assert ui_controller3_p4_only
splitinput_device_key controller3 RIGHTARROW 1
wait 4
splitinput_device_key controller3 RIGHTARROW 0
wait 30
splitinput_assert_model 1 kyle/default
splitinput_assert_model 2 reborn_new/default
splitinput_assert_model 3 galak/default
splitinput_assert_model 4 tavion_new/default
splitui_assert ui_splitScreenInputTarget 4

echo InputIsolation4Assert ui_keyboard_p1_only
splitinput_device_mouse -10000 -10000
wait 10
splitinput_device_mouse 200 100
wait 20
splitui_assert ui_splitScreenMouseOwner 1
splitui_assert ui_splitScreenMouseCursorX 200
splitui_assert ui_splitScreenMouseCursorY 100
splitinput_device_key keyboard RIGHTARROW 1
wait 4
splitinput_device_key keyboard RIGHTARROW 0
wait 30
splitinput_assert_model 1 lando/default
splitinput_assert_model 2 reborn_new/default
splitinput_assert_model 3 galak/default
splitinput_assert_model 4 tavion_new/default
splitui_assert ui_splitScreenInputTarget 0
splitui_assert ui_splitScreenLastInputDevice keyboard

echo InputIsolation4Assert mouse_clamped_to_p1
splitinput_device_mouse 10000 10000
wait 30
splitui_assert ui_splitScreenMouseOwner 1
splitui_assert ui_splitScreenMouseCursorX 319
splitui_assert ui_splitScreenMouseCursorY 239
splitui_assert ui_splitScreenInputTarget 1
splitinput_assert_model 2 reborn_new/default
splitinput_assert_model 3 galak/default
splitinput_assert_model 4 tavion_new/default
screenshot_png splitqa_input_isolation_4p_ui

set ui_splitScreenMenuMode ""
set ui_splitScreenInputTarget 0
closemenu
wait 60
splitinput_clear 1
splitinput_clear 2
splitinput_clear 3
splitinput_clear 4

echo InputIsolation4Assert gameplay_keyboard_p1_only
+forward
wait 20
splitinput_assert_cmd 1 -998 0 0 -999
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
-forward
wait 10

echo InputIsolation4Assert gameplay_mouse_not_p2_p3_or_p4
splitinput_device_mouse 80 -30
wait 20
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0

echo InputIsolation4Assert gameplay_controller1_p2_only
splitinput_device_axis controller1 1 -127
wait 20
splitinput_assert_cmd 1 0 0 0 -999
splitinput_assert_cmd 2 127 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_axis controller1 1 0
wait 10
splitinput_device_button controller1 0 1
wait 20
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 1
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller1 0 0
wait 20
splitinput_assert_cmd 2 0 0 0 0

echo InputIsolation4Assert gameplay_controller2_p3_only
splitinput_device_axis controller2 0 -80
wait 20
splitinput_assert_cmd 1 0 0 0 -999
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 -80 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_axis controller2 0 0
wait 10
splitinput_device_button controller2 0 1
wait 20
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 1
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller2 0 0
wait 20
splitinput_assert_cmd 3 0 0 0 0

echo InputIsolation4Assert gameplay_controller3_p4_only
splitinput_device_axis controller3 1 -96
wait 20
splitinput_assert_cmd 1 0 0 0 -999
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 96 0 0 0
splitinput_device_axis controller3 1 0
wait 10
splitinput_device_button controller3 0 1
wait 20
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 1
splitinput_device_button controller3 0 0
wait 20
splitinput_assert_cmd 4 0 0 0 0
screenshot_png splitqa_input_isolation_4p_gameplay
splitui_status
condump splitqa_input_isolation_4p_console.txt
wait 20
quit
