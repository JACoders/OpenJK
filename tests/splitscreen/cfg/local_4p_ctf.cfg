set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set g_gametype 8
set name QA_CTFRed1
set ui_splitScreenP1Name QA_CTFRed1
set ui_splitScreenP2Name QA_CTFBlue2
set ui_splitScreenP3Name QA_CTFRed3
set ui_splitScreenP4Name QA_CTFBlue4
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ctf1
wait 720
closemenu
wait 20
cmd team red
splitnet_cmd 2 team blue
splitnet_cmd 3 team red
splitnet_cmd 4 team blue
wait 240
splitnet_assert_stat 1 team eq 1
splitnet_assert_stat 2 team eq 2
splitnet_assert_stat 3 team eq 1
splitnet_assert_stat 4 team eq 2
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_local_4p_ctf_start
wait 80
condump splitqa_local_4p_ctf_console.txt
wait 20
quit
