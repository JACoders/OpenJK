set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set g_gametype 6
set g_friendlyFire 0
set g_saberDamageScale 20
set fraglimit 0
set con_notifytime 0
set name GP5_Team_2_P1
set ui_splitScreenP2Name GP5_Team_2_P2
devmap mp/ffa3
wait 480
closemenu
cmd team red
splitnet_connect 2 localhost
wait 390
splitnet_cmd 2 team blue
wait 180
echo GP5-01:TEAM-ASSIGN-BEGIN
splitnet_assert_stat 1 team eq 1
splitnet_assert_stat 2 team eq 2
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp5_team_assignment
echo GP5-01:TEAM-ASSIGN-END

echo GP5-01:ROUTED-COMBAT-BEGIN
cmd give weaponnum 3
weapon 1
wait 180
splitnet_stage_pair 1 2 48
cmd giveother 1 health 1
wait 40
splitinput_device_key keyboard MOUSE1 1
wait 120
splitinput_assert_cmd 1 -999 -999 -999 -998
splitinput_device_key keyboard MOUSE1 0
wait 80
splitnet_stage_pair 1 2 48
splitinput_device_key keyboard MOUSE1 1
wait 160
splitinput_device_key keyboard MOUSE1 0
wait 80
splitnet_stage_pair 1 2 48
splitinput_device_key keyboard MOUSE1 1
wait 200
splitinput_device_key keyboard MOUSE1 0
wait 120
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_stat 1 score ge 1
screenshot_png gp5_enemy_kill
echo GP5-01:ROUTED-COMBAT-END

echo GP5-01:P2-RESPAWN-BEGIN
wait 120
splitinput_device_button controller1 0 1
wait 60
splitinput_device_button controller1 0 0
wait 420
splitnet_assert_lifecycle 2 ALIVE
echo GP5-01:P2-RESPAWN-END

echo GP5-01:P1-SUICIDE-RESPAWN-BEGIN
cmd kill
wait 120
splitnet_assert_lifecycle 1 DEAD
splitnet_assert_stat 1 deaths ge 1
splitinput_device_key keyboard MOUSE1 1
wait 60
splitinput_device_key keyboard MOUSE1 0
wait 420
splitnet_assert_lifecycle 1 ALIVE
echo GP5-01:P1-SUICIDE-RESPAWN-END

echo GP5-01:TEAM-SWITCH-BEGIN
splitnet_cmd 2 team red
wait 1500
splitnet_assert_stat 2 team eq 1
splitnet_cmd 2 team blue
wait 1500
splitnet_assert_stat 2 team eq 2
echo GP5-01:TEAM-SWITCH-END

echo GP5-01:SPECTATE-REJOIN-BEGIN
splitnet_cmd 2 team spectator
wait 1500
splitnet_assert_lifecycle 2 SPECTATOR
splitnet_cmd 2 team blue
wait 1500
splitnet_assert_lifecycle 2 ALIVE
echo GP5-01:SPECTATE-REJOIN-END

echo GP5-01:RESTART-BEGIN
map_restart 0
wait 420
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp5_map_restart
echo GP5-01:RESTART-END

echo GP5-01:SECOND-MAP-BEGIN
devmap mp/ffa2
wait 600
cmd team red
splitnet_cmd 2 team blue
wait 240
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp5_second_map
echo GP5-01:SECOND-MAP-END

echo GP5-01:INTERMISSION-BEGIN
set fraglimit 1
map_restart 0
wait 420
cmd give weaponnum 3
weapon 1
wait 180
splitnet_stage_pair 1 2 48
cmd giveother 1 health 1
wait 40
splitinput_device_key keyboard MOUSE1 1
wait 160
splitinput_device_key keyboard MOUSE1 0
wait 80
splitnet_stage_pair 1 2 48
splitinput_device_key keyboard MOUSE1 1
wait 200
splitinput_device_key keyboard MOUSE1 0
wait 420
splitnet_assert_lifecycle 1 INTERMISSION
splitnet_assert_lifecycle 2 INTERMISSION
screenshot_png gp5_intermission
wait 120
echo GP5-01:INTERMISSION-END
condump gp5_team_ffa_console.txt
echo GP5-01:COMPLETE
wait 20
quit
