set com_maxfps 60
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Mode_P1
set ui_splitScreenP1Name QA_Mode_P1
set ui_splitScreenP2Name QA_Mode_P2
set ui_splitScreenP3Name QA_Mode_P3
set ui_splitScreenP4Name QA_Mode_P4
set ui_splitScreenPartyState disconnected
set cl_splitScreenPartyTarget localhost
splitnet_party_connect localhost

set g_gametype 0
devmap mp/ffa3
wait 600
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
wait 180
splitui_assert ui_splitScreenPartyState active
splitui_assert g_gametype 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
set developer 0
screenshot_png phase5_mode_ffa

set g_gametype 1
map mp/ffa3
wait 540
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
