set com_maxfps 60
set con_notifytime 0
set ui_splitScreenTraceInput 1
set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set name QA_Duel_P1
set ui_splitScreenP1Name QA_Duel_P1
set ui_splitScreenP2Name QA_Duel_P2
set g_saberDamageScale 5
set g_gametype 3
splitnet_party_connect localhost
devmap mp/duel1
wait 700
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_applyprofile 2
wait 300
closemenu
splitui_assert ui_splitScreenPartyState active
splitui_assert g_gametype 3
splitnet_assert_stat 1 team eq 0
splitnet_assert_stat 2 team eq 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png phase5_duel_ready

splitnet_stage_pair 1 2 44
wait 90
echo Phase5Duel: READY_P1_ATTACK
wait 480
splitnet_assert_stat 1 score ge 1
splitnet_assert_lifecycle 2 DEAD
screenshot_png phase5_duel_round_end
echo Phase5Duel: READY_P2_RESPAWN
wait 450
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png phase5_duel_respawned
quit
