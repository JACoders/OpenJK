vstr routed_right
vstr routed_right
vstr routed_right
wait 20
splitprofile_status
ui_splitScreenP2ModelIndex
ui_splitScreenP2Model
splitui_assert ui_splitScreenP2Model desann/default
screenshot_png routed_selection_p2_sith

// P2: controller-only Force flow chooses the first Light preset (Defender).
// Defender allocates light powers and leaves Grip/Lightning/Rage/Drain at 0.
splitinput_device_key controller1 JOY10 1
wait 3
splitinput_device_key controller1 JOY10 0
wait 15
splitinput_device_key controller1 DOWNARROW 1
wait 3
splitinput_device_key controller1 DOWNARROW 0
wait 5
splitinput_device_key controller1 ENTER 1
wait 3
splitinput_device_key controller1 ENTER 0
wait 15
splitui_assert ui_splitScreenP2ForcePowers 7-1-332300000330003230
screenshot_png routed_selection_p2_light
splitinput_device_key controller1 JOY7 1
wait 3
splitinput_device_key controller1 JOY7 0
wait 20
splitinput_device_key controller1 JOY7 1
wait 3
splitinput_device_key controller1 JOY7 0
wait 30

// Prove persisted profile isolation without bypassing visible routed UI state.
splitui_assert ui_splitScreenP1Model kyle/default
splitui_assert ui_splitScreenP1ForcePowers 7-2-012320333000030321
splitui_assert ui_splitScreenP2Model desann/default
splitui_assert ui_splitScreenP2ForcePowers 7-1-332300000330003230
splitprofile_status
screenshot_png routed_selection_profiles_final

// Accept the selected P2 profile through its routed visible action.
splitinput_device_key controller1 JOY7 1
wait 3
splitinput_device_key controller1 JOY7 0
wait 30

// Instantiate both live clients from the profiles accepted above. No model or
// Force cvar is written by this cfg: P1's visible Apply copied its accepted
// profile to the game cvars, while P2's party connection consumes its profile.
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 3600
closemenu
cmd team free
splitnet_cmd 2 team free
wait 180
cmd forcechanged
splitnet_cmd 2 forcechanged
wait 180
cmd splitscreen_assert_userinfo 1 model kyle/default
cmd splitscreen_assert_userinfo 1 forcepowers 7-2-012320333000030321
cmd splitscreen_assert_userinfo 2 model desann/default
cmd splitscreen_assert_userinfo 2 forcepowers 7-1-332300000330003230
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE

// P2 attacks Kyle through controller1's routed normal-attack button.
unbind l
bind l "+force_lightning"
splitnet_stage_pair 2 1 40
cmd giveother 0 health 999
wait 60
splitinput_device_button controller1 0 1
wait 60
splitinput_assert_cmd 2 -999 -999 -999 1
splitinput_device_button controller1 0 0
wait 60
splitnet_assert_stat 1 health lt 999
screenshot_png routed_selection_p2_attacks_kyle

// P1's routed keyboard event supplies the real Lightning kill.
splitnet_stage_pair 1 2 72
cmd giveother 1 health 1
wait 60
splitinput_device_key keyboard l 1
wait 20
splitinput_assert_cmd 1 -999 -999 -999 1280
screenshot_png routed_selection_kyle_lightning
wait 600
splitinput_device_key keyboard l 0
wait 120
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_stat 1 score ge 1
screenshot_png routed_selection_kyle_lightning_kill
condump routed_selection_continuous_console.txt
wait 20
quit
