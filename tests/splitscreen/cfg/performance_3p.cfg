set com_maxfps 0
set com_busyWait 0
set r_swapInterval 0
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 0
set name Perf_P1
set ui_splitScreenP2Name Perf_P2
set ui_splitScreenP3Name Perf_P3
splitnet_party_connect localhost
devmap mp/ffa3
wait 540
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
echo SplitPerf: BEGIN players=3
set com_speeds 1
wait 1200
set com_speeds 0
echo SplitPerf: END players=3
screenshot_png splitqa_performance_3p
wait 20
quit
