set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set ui_splitScreenP1Name QA_Game1
set ui_splitScreenP2Name QA_Game2
set ui_splitScreenP3Name QA_Game3
set ui_splitScreenP4Name QA_Game4
set name QA_Game1
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
splitinput_route_status
echo SplitGameplayAssert initial
splitinput_clear 2
splitinput_clear 3
splitinput_clear 4
splitinput_assert_cmd 1 0 0 0 -999
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
+forward
wait 20
echo SplitGameplayAssert keyboard_forward
splitinput_assert_cmd 1 -998 0 0 -999
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
-forward
wait 10
splitinput_device_axis controller1 1 -127
wait 20
echo SplitGameplayAssert controller1_forward
splitinput_assert_cmd 1 0 0 0 -999
splitinput_assert_cmd 2 127 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_axis controller1 1 0
wait 10
splitinput_device_axis controller2 0 -80
wait 20
echo SplitGameplayAssert controller2_strafe
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 -80 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_axis controller2 0 0
wait 10
splitinput_device_button controller3 1 1
wait 20
echo SplitGameplayAssert controller3_altattack
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 128
splitinput_device_button controller3 1 0
wait 10
splitinput_device_mouse 36 -12
wait 20
echo SplitGameplayAssert mouse_no_controller_bleed
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
echo SplitGameplayAssert swapped_device_ownership
set ui_splitScreenP1Input controller1
set ui_splitScreenP2Input keyboard
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
splitinput_clear 1
splitinput_clear 2
splitinput_clear 3
splitinput_clear 4
splitinput_route_status
+forward
wait 20
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 -998 0 0 -999
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
-forward
wait 10
splitinput_device_axis controller1 1 -127
wait 20
splitinput_assert_cmd 1 127 0 0 0
splitinput_assert_cmd 2 0 0 0 -999
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_axis controller1 1 0
wait 10
+attack
wait 20
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 -998
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
-attack
wait 10
cmd team free
wait 40
closemenu
wait 40
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
screenshot_png splitqa_gameplay_input_sim
condump splitqa_gameplay_input_sim_console.txt
wait 20
quit
