set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set s_initsound 1
set s_volume 0.8
set s_musicvolume 0.2
set g_gametype 0
set fraglimit 10
set sv_maxclients 8
set g_maxConnPerIP 8
devmap mp/ffa3
wait 720
closemenu
cmd team free
splitnet_connect 2 localhost
wait 480
splitnet_cmd 2 team free
wait 240
echo GP305:ATTACHED
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp305_audio_attached
echo GP305:PER-PANE-ACTIONS
splitinput_device_key keyboard MOUSE1 1
wait 30
splitinput_assert_cmd 1 -999 -999 -999 1
splitinput_device_key keyboard MOUSE1 0
splitinput_device_button controller1 0 1
wait 30
splitinput_assert_cmd 2 -999 -999 -999 1
splitinput_device_button controller1 0 0
say GP305_network_chat
splitnet_cmd 2 kill
wait 180
splitnet_assert_lifecycle 2 DEAD
splitinput_device_button controller1 0 1
wait 30
splitinput_device_button controller1 0 0
wait 300
splitnet_assert_lifecycle 2 ALIVE
echo GP305:SND-RESTART
snd_restart
wait 600
echo GP305:SND-RESTART-COMPLETE
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
map_restart 0
wait 600
echo GP305:MAP-RESTART-COMPLETE
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp305_audio_restarted
wait 900
echo GP305:AUDIO-SHUTDOWN
quit
