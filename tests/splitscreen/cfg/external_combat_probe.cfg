set com_maxfps 60
set con_notifytime 0
set ui_splitScreenTraceInput 1
set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set name QA_Combat1
set ui_splitScreenP1Name QA_Combat1
set ui_splitScreenP2Name QA_Combat2
set ui_splitScreenP2ForcePowers 7-1-032330000000001333
set g_saberDamageScale 5
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
splitnet_connect 2 localhost
wait 360
splitnet_cmd 2 team free
splitnet_applyprofile 2
splitnet_cmd 2 forcechanged
cmd give weapons
wait 120
weapon 1
wait 180
closemenu
wait 30
splitui_status
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_stage_pair 1 2 72
wait 90
splitnet_assert_stat 1 health gt 0
splitnet_assert_stat 2 health gt 0
echo ExternalCombatProbe: READY_P1_ATTACK
wait 100
splitinput_assert_cmd 1 0 0 0 257 3
cmd splitscreen_assert_cmd 1 257 3
wait 700
splitnet_assert_lifecycle 2 DEAD
splitnet_assert_stat 1 hits gt 0
splitnet_assert_stat 1 score ge 1
screenshot_png splitqa_combat_p1_killed_p2

echo ExternalCombatProbe: READY_P2_RESPAWN
wait 300
splitnet_assert_lifecycle 2 ALIVE
splitnet_stage_pair 2 1 72
wait 90
echo ExternalCombatProbe: READY_P2_ATTACK
wait 100
splitinput_assert_cmd 2 0 0 0 1 3
cmd splitscreen_assert_cmd 2 1 3
wait 700
splitnet_assert_lifecycle 1 DEAD
splitnet_assert_stat 2 hits gt 0
splitnet_assert_stat 2 score ge 1
screenshot_png splitqa_combat_p2_killed_p1

echo ExternalCombatProbe: READY_P1_RESPAWN
wait 300
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitscreen_bind_controller 2 10 force_throw
set cl_splitScreenP2LastGenericCmd 0
splitnet_stage_pair 2 1 -72
wait 90
echo ExternalCombatProbe: READY_P2_FORCE
wait 160
splitui_assert cl_splitScreenP2LastGenericCmd 5
wait 180
splitnet_assert_stat 2 force lt 100
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png splitqa_combat_p2_force_push
splitscreen_reset_controller 2
wait 20
quit
