set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set net_port 29170
set ui_splitScreenP1Name QA_Net1
set ui_splitScreenP2Name QA_Net2
set ui_splitScreenP3Name QA_Net3
set ui_splitScreenP4Name QA_Net4
devmap mp/ffa3
wait 360
splitnet_connect 2 127.0.0.1:29170
wait 120
splitnet_connect 3 127.0.0.1:29170
wait 120
splitnet_connect 4 127.0.0.1:29170
wait 600
splitnet_status
wait 80
splitnet_applyprofile 2
wait 40
splitnet_applyprofile 3
wait 40
splitnet_applyprofile 4
wait 80
splitnet_cmd 2 team free
wait 80
splitnet_cmd 3 team s
wait 120
splitnet_cmd 3 team free
wait 120
splitnet_status
screenshot_png splitqa_splitnet_localhost
condump splitqa_splitnet_localhost_console.txt
wait 20
splitnet_disconnect 4
wait 40
splitnet_disconnect 3
wait 40
splitnet_disconnect 2
wait 40
quit
