set com_maxfps 60
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set name QA_PDuel_P1
set ui_splitScreenP1Name QA_PDuel_P1
set ui_splitScreenP2Name QA_PDuel_P2
set ui_splitScreenP3Name QA_PDuel_P3
set g_gametype 4
splitnet_party_connect localhost
devmap mp/duel1
wait 700
closemenu
cmd duelteam single
splitnet_cmd 2 duelteam double
splitnet_cmd 3 duelteam double
wait 900
closemenu
splitui_assert ui_splitScreenPartyState active
splitui_assert g_gametype 4
splitnet_assert_stat 1 team eq 0
splitnet_assert_stat 2 team eq 0
splitnet_assert_stat 3 team eq 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
screenshot_png phase5_powerduel_active
echo Phase5PowerDuel: READY_ALL_ATTACK
wait 120
splitinput_assert_cmd 1 0 0 0 257
splitinput_assert_cmd 2 -998 0 0 1
splitinput_assert_cmd 3 -998 0 0 1
screenshot_png phase5_powerduel_input
wait 1100
splitinput_assert_cmd 1 0 0 0 0
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
wait 20
quit
