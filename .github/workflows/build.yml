name: build

# Builds and releases only when a version tag is pushed (git tag v0.13.0 && git push origin v0.13.0),
# the release named after it. "Run workflow" on the Actions tab builds without releasing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  msvc:
    name: Windows x86 Release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.3.2

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=bin -DBuildPortableVersion=OFF

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config Release -j $NUMBER_OF_PROCESSORS

      - name: Install
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --install . --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: OpenJK-windows-x86-Release-Non-Portable
          path: ${{ github.workspace }}/build/bin/JediAcademy
          if-no-files-found: error

  ubuntu:
    name: Ubuntu x86 Release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create Build Environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get -y install aptitude
          sudo apt-get -y install gcc-multilib g++-multilib ninja-build
          sudo apt-get -y install --allow-downgrades libpcre2-8-0:i386 libjpeg-dev:i386 libpng-dev:i386 libcurl4-openssl-dev:i386
          sudo aptitude -y install libglib2.0-dev:i386 libsdl2-dev:i386
          cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: |
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DUseInternalLibs=OFF -DBuildPortableVersion=OFF -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchains/linux-i686.cmake

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . -j $(nproc)

      - name: Install
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --install .

      - name: Create OpenJK binary archive
        working-directory: ${{ github.workspace }}/install/JediAcademy
        shell: bash
        run: tar -czvf OpenJK-linux-x86-Release-Non-Portable.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: OpenJK-linux-x86-Release-Non-Portable
          path: ${{ github.workspace }}/install/JediAcademy/OpenJK-linux-x86-Release-Non-Portable.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} Release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create Build Environment
        run: |
          brew install zlib libjpeg libpng sdl2
          cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: |
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DUseInternalLibs=OFF -DBuildPortableVersion=OFF

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . -j $(getconf _NPROCESSORS_ONLN)

      - name: Install
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --install .

      - name: Create OpenJK binary archive
        working-directory: ${{ github.workspace }}/install/JediAcademy
        shell: bash
        run: tar -czvf openjk-macos-${{ matrix.arch }}-Release-Non-Portable.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: OpenJK-macos-${{ matrix.arch }}-Release-Non-Portable
          path: ${{ github.workspace }}/install/JediAcademy/openjk-macos-${{ matrix.arch }}-Release-Non-Portable.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, ubuntu, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create binary archives
        run: |
          7z a -r OpenJK-windows-x86.zip ./OpenJK-windows-x86-Release-Non-Portable/* '-x!msvcp*.*' '-x!vcruntime*.*' '-x!concrt*.*'
          mv ./OpenJK-linux-x86-Release-Non-Portable/* OpenJK-linux-x86.tar.gz
          mv ./OpenJK-macos-x86_64-Release-Non-Portable/* OpenJK-macos-x86_64.tar.gz
          mv ./OpenJK-macos-arm64-Release-Non-Portable/* OpenJK-macos-arm64.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenJK-rpmod ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            *.zip
            *.tar.gz
