// Diagnostic-only public capacity probe. Supply `probe_join` on the command
// line; public acceptance must use routed_public_4p_acceptance.cfg instead.
set cl_splitScreen 1
set cl_splitScreenLocalCmds 0
set ui_splitScreenPlayerCount 4
set ui_splitScreenP1Name Probe4_P1
set ui_splitScreenP2Name Probe4_P2
set ui_splitScreenP3Name Probe4_P3
set ui_splitScreenP4Name Probe4_P4
set name Probe4_P1
splitscreen_setup 4
wait 30
vstr probe_join
wait 1800
cmd team auto
splitnet_cmd 2 team auto
splitnet_cmd 3 team auto
splitnet_cmd 4 team auto
wait 300
splitinput_device_key keyboard MOUSE1 1
splitinput_device_button controller1 0 1
splitinput_device_button controller2 0 1
splitinput_device_button controller3 0 1
wait 20
splitinput_device_key keyboard MOUSE1 0
splitinput_device_button controller1 0 0
splitinput_device_button controller2 0 0
splitinput_device_button controller3 0 0
wait 300
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
condump public_4p_probe_console.txt
wait 10
quit
