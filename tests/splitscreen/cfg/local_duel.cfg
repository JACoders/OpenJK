set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set g_gametype 3
set name QA_Duel1
set ui_splitScreenP1Name QA_Duel1
set ui_splitScreenP2Name QA_Duel2
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/duel1
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
wait 180
splitnet_assert_stat 1 team eq 0
splitnet_assert_stat 2 team eq 0
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_status
screenshot_png splitqa_local_duel_start
wait 80
condump splitqa_local_duel_console.txt
wait 20
quit
