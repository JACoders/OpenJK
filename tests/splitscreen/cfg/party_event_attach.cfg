set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set net_port 29170
set ui_splitScreenP1Name QA_Party1
set name QA_Party1
set ui_splitScreenP2Name QA_Party2
set ui_splitScreenP3Name QA_Party3
set ui_splitScreenP4Name QA_Party4
set ui_splitScreenP2Joined 0
set ui_splitScreenP3Joined 0
set ui_splitScreenP4Joined 0
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
splitui_assert ui_splitScreenPartyState connecting
wait 80
devmap mp/ffa3
wait 720
splitui_assert ui_splitScreenPartyState active
splitui_assert ui_splitScreenP2Joined 1
splitui_assert ui_splitScreenP3Joined 1
splitui_assert ui_splitScreenP4Joined 1
closemenu
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_party_event_attach
wait 20
quit
