set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set fraglimit 5
set timelimit 0
splitnet_party_connect localhost
devmap mp/ffa3
wait 1440
closemenu
splitui_assert ui_splitScreenPartyState active
cmd team free
splitnet_cmd 2 team free
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp501_spawn

// Combat input attribution and Lightning are certified by the visible-profile
// journey. This generic mode probe owns lifecycle only, so use the
// authoritative cheat instead of pretending one nondeterministic saber swing
// is a combat oracle.
cmd killother 1
wait 480
splitnet_assert_lifecycle 2 DEAD
screenshot_png gp501_lifecycle_death

wait 180
splitinput_device_button controller1 0 1
wait 30
splitinput_device_button controller1 0 0
wait 240
splitnet_assert_lifecycle 2 ALIVE
splitnet_cmd 2 team spectator
wait 180
splitnet_assert_lifecycle 2 SPECTATOR

// Stock game rejects a second team switch for five seconds. Wait beyond that
// policy before testing a valid rejoin instead of misclassifying @@@NOSWITCH.
wait 720
splitnet_cmd 2 team free
wait 480
splitnet_assert_lifecycle 2 ALIVE
map_restart 0
wait 480
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
map mp/ffa5
wait 600
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
screenshot_png gp501_next_map
quit
