set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 0
set con_notifytime 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_Combat1
set ui_splitScreenP2Name QA_Combat2
set ui_splitScreenP3Name QA_Combat3
set ui_splitScreenP4Name QA_Combat4
set ui_splitScreenP2ForcePowers 7-1-333003000313003120
set ui_splitScreenP3ForcePowers 7-1-333003000313003120
set ui_splitScreenP4ForcePowers 7-1-333003000313003120
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/ffa3
wait 720
closemenu
wait 20
cmd team free
splitnet_cmd 2 team free
splitnet_cmd 3 team free
splitnet_cmd 4 team free
splitnet_applyprofile 2
splitnet_applyprofile 3
splitnet_applyprofile 4
wait 180
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitinput_route_status
splitinput_clear 2
splitinput_clear 3
splitinput_clear 4
echo SplitControlsAssert default_controls
splitinput_device_button controller1 0 1
wait 20
splitinput_assert_cmd 2 0 0 0 1
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller1 0 0
wait 10
splitinput_device_button controller2 1 1
wait 20
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 128
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller2 1 0
wait 10
splitinput_device_button controller3 3 1
wait 20
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 127 0
splitinput_device_button controller3 3 0
wait 10
splitscreen_bind_controller 2 4 force_throw
splitscreen_bind_controller 3 5 +force_lightning
splitscreen_bind_controller 4 6 +force_grip
wait 20
echo SplitControlsAssert custom_force_bindings
splitinput_device_button controller1 4 1
splitinput_assert_cmd 2 0 0 0 0 -999 -999 5
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller1 4 0
wait 10
splitinput_device_button controller2 5 1
wait 20
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 1024
splitinput_assert_cmd 4 0 0 0 0
splitinput_device_button controller2 5 0
wait 10
splitinput_device_button controller3 6 1
wait 20
splitinput_assert_cmd 2 0 0 0 0
splitinput_assert_cmd 3 0 0 0 0
splitinput_assert_cmd 4 0 0 0 64
splitinput_device_button controller3 6 0
wait 10
splitscreen_bind_controller 2 7 weapon 5
splitinput_device_button controller1 7 1
wait 20
splitinput_assert_cmd 2 0 0 0 0 5
splitinput_device_button controller1 7 0
wait 20
cmd splitscreen_place 2 96
wait 20
cmd splitscreen_place 3 112
wait 20
cmd splitscreen_place 4 128
wait 60
echo SplitCombatAssert command_stream
splitinput_device_axis controller1 1 -127
splitinput_device_axis controller2 0 -80
splitinput_device_axis controller3 1 -96
splitinput_device_button controller1 0 1
splitinput_device_button controller2 0 1
splitinput_device_button controller3 0 1
wait 40
splitinput_assert_cmd 2 127 0 0 1
splitinput_assert_cmd 3 0 -80 0 1
splitinput_assert_cmd 4 96 0 0 1
splitinput_device_axis controller1 1 0
splitinput_device_axis controller2 0 0
splitinput_device_axis controller3 1 0
splitinput_device_button controller1 0 0
splitinput_device_button controller2 0 0
splitinput_device_button controller3 0 0
wait 100
splitnet_assert_lifecycle 1 ALIVE
splitnet_assert_lifecycle 2 ALIVE
splitnet_assert_lifecycle 3 ALIVE
splitnet_assert_lifecycle 4 ALIVE
splitnet_status
screenshot_png splitqa_controls_force_combat_sim
condump splitqa_controls_force_combat_sim_console.txt
wait 20
quit
