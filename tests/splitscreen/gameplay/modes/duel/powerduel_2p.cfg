set developer 1
set con_notifytime 0
set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 0
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set g_gametype 4
set duel_fraglimit 1
set g_saberDamageScale 20
set ui_splitScreenPartyState configuring
splitnet_party_connect localhost
devmap mp/duel1
wait 900
closemenu
cmd team free
splitnet_cmd 2 team free
wait 600
splitui_assert g_gametype 4
splitnet_status
echo GP2-DUEL:INITIAL
wait 30
echo GP2-DUEL:POWER-CAPACITY
cmd duelteam single
splitnet_cmd 2 duelteam double
wait 600
splitnet_status
screenshot_png gp2_powerduel_2p_roles
echo GP2-DUEL:POWER-UNSUPPORTED-CAPACITY
wait 180
splitnet_status
screenshot_png gp2_powerduel_2p_final
splitnet_status
echo GP2-DUEL:COMPLETE
condump gp2_powerduel_2p_console.txt
wait 20
quit
